name: Research Lab Editorial Review
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish drafts already approved by a human
        type: boolean
        default: false
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: research-lab-editorial-review
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || vars.REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0 trafilatura==2.0.0
      - name: Process editorial queue
        env:
          REVIEW_API_SECRET: ${{ secrets.REVIEW_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          PUBLISH: ${{ inputs.publish || (github.event_name == 'schedule' && vars.REVIEW_PUBLISH_ENABLED == 'true') }}
          COLLECT: ${{ vars.REVIEW_COLLECT_ENABLED }}
        run: |
          args=()
          if [ "$PUBLISH" = 'true' ]; then args+=(--publish); fi
          if [ "$COLLECT" = 'true' ]; then args+=(--collect); fi
          python review_processor.py "${args[@]}"

